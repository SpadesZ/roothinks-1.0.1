# Path: alembic.ini
# Created: 2026-07-04 19:20 +08:00
# Version: v0.1
# Note: Minimal Alembic scaffold. Override sqlalchemy.url with DATABASE_URL when needed.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./instance/roothinks.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
