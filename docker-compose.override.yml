# Roothinks development override
# Loaded automatically by `docker compose up`.
# [MVP+Prototype Handoff Header]
# 本檔案目前定位為 MVP/Prototype 環境設定；非最終產品級設計。
# 對應規劃檔：CHANGE_PLAN_STUDY_FLOWB_2026-04-20.md
# 2026-04-20~2026-04-21 Flow B timeout/retry/chunk 參數為階段性調參，後續請由人類團隊接手正式化。

services:
  roothinks-paq:
    # Dev-only workaround for Windows bind-mount ACL mismatches.
    user: "0:0"
    volumes:
      - .:/app
    env_file:
      - .env
    # Dev stability profile:
    # - Use gthread for CPU-heavy OCR flow (avoid eventlet worker freeze)
    # - Relax local resource limits for demo/testing
    # 開發機給 4 核；GCP VM 是 e2-medium（2 vCPU），在該機 .env 設 COMPOSE_CPUS=2.0。
    cpus: ${COMPOSE_CPUS:-4.0}
    mem_limit: 4g
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - TZ=Asia/Taipei
      - API_AUTH_ENABLED=0
      # 這一行寫死曾經讓正式站的 Socket.IO 完全連不上：對外是
      # http://34.80.240.29，不在名單內 → 每次 websocket 握手都回 400
      # （實測 128 次全 400、polling 請求 0 次，等於沒有任何可用傳輸）。
      # 於是 chat_message 送不到伺服器，草稿請求永遠沒有回應。
      # compose 的 environment: 優先序高於 env_file:，所以就算該機 .env
      # 設對了也會被這一行蓋掉 —— 必須做成變數才輪得到 .env 生效。
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:10005,http://localhost:10005}
      - GUNICORN_WORKERS=1
      - GUNICORN_WORKER_CLASS=gthread
      - GUNICORN_THREADS=8
      - GUNICORN_TIMEOUT=900
      - GUNICORN_GRACEFUL_TIMEOUT=90
      - SOCKETIO_ASYNC_MODE=threading
      - SOCKETIO_MESSAGE_QUEUE=redis://redis:6379/1
      - LITERATURE_MAX_WORKERS=1
      - LITERATURE_FLOWB_TIMEOUT_SEC=7200
      - LITERATURE_FLOWB_STALE_SEC=7500
      - GOOGLE_LLM_TIMEOUT_SEC=210
      - GOOGLE_LLM_MAX_RETRIES=3
      - GOOGLE_LLM_RETRY_BACKOFF_SEC=1
      - GOOGLE_LLM_MAX_BACKOFF_SEC=180
      - GOOGLE_LLM_RATE_LIMIT_ENABLED=1
      - GOOGLE_LLM_GLOBAL_RPM_LIMIT=12
      - GOOGLE_LLM_GLOBAL_TPM_LIMIT=25000
      - GOOGLE_LLM_GLOBAL_RPD_LIMIT=0
      - GOOGLE_LLM_QUOTA_WAIT_MAX_SEC=180
      - GOOGLE_LLM_QUOTA_POLL_SEC=1
      - TASK4_AUTOHEAL_MAX_RETRY=1
      - TASK4_AUTOHEAL_COOLDOWN_SEC=900
      - LITERATURE_USE_DIRECT_THREAD=1
      - LITERATURE_ANALYZING_STALE_SEC=300
      - LITERATURE_OCR_LANGS=en,zh-Hant
      - LITERATURE_OCR_READY_RATIO=1.0
      - LITERATURE_STAGE_READY_RATIO=1.0
      - VNS_SURYA_EQ_ENABLE=0
      - VNS_SURYA_EQ_HINT_FILE=
      - VNS_SURYA_EQ_CONF_THRESHOLD=0.62
      - VNS_SURYA_EQ_MERGE_IOU=0.38
      - VNS_SURYA_EQ_MAX_HINTS_PER_PAGE=12
      - LITERATURE_STACKA_TIMEOUT_SEC=120
      - LITERATURE_STACKB_TIMEOUT_SEC=300
      - LITERATURE_STACK_TIMEOUT_GRACE_SEC=15
      - LITERATURE_FLOWB_REFLOW_MAX_ROWS=220
      - LITERATURE_FLOWB_REFLOW_CHUNK_ROWS=32
      - LITERATURE_FLOWB_REFLOW_CHUNK_SPLIT_DEPTH=2
      - LITERATURE_FLOWB_REFLOW_MIN_SPLIT_ROWS=12
      - LITERATURE_FLOWB_REFLOW_ROW_TEXT_MAX_CHARS=900
      - LITERATURE_FLOWB_REFLOW_ROW_LANG_MAX_CHARS=1400
      - LITERATURE_FLOWB_REFLOW_SECTION_MAX_LINES=64
      - LITERATURE_FLOWB_REFLOW_SECTION_MAX_CHARS=12000
      - LITERATURE_FLOWB_REFLOW_MAX_REFS_PER_SECTION=128
      - LITERATURE_FLOWB_REFLOW_MAX_DROPPED_REFS_PER_SECTION=256
      - LITERATURE_FLOWB_REFLOW_MODE=strict_extract
      - LITERATURE_FLOWB_ALLOW_TASK5INTERPRET_FALLBACK=1
      - LITERATURE_FLOWB_READY_GENERATION_MODES=task_5b_reflow,task_5interpret,heuristic_fallback
      - LITERATURE_FLOWB_APPENDIX_MAX_REFS=180
      - LITERATURE_FLOWB_QUALITY_GATE_ENABLED=1
      - LITERATURE_FLOWB_QUALITY_MIN_BLOCKS=16
      - LITERATURE_FLOWB_MIN_AVG_TOKENS_PER_BLOCK=4.0
      - LITERATURE_FLOWB_MAX_STACKB_RATIO=0.92
      - LITERATURE_FLOWB_MIN_AVG_TOKENS_FOR_HIGH_STACKB=8.0
      - STUDY_REFLOW_MIN_COVERAGE_RATIO=0.55
      - STUDY_REFLOW_MIN_REF_COVERAGE_RATIO=0.45
      - STUDY_REFLOW_MIN_CHAR_COVERAGE_RATIO=0.55
      - STUDY_REFLOW_MIN_SECTIONS=2
      - STUDY_REFLOW_ALLOW_SUPPRESS=0
