[MVP+Prototype Handoff Header]
本模板目前定位為 MVP/Prototype 實作；非最終產品級設計。
對應規劃檔：CHANGE_PLAN_STUDY_FLOWB_2026-04-20.md

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOTHINKS-B Study Field</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">
    <style>
        .gutter {
            background-color: #f1f3f5;
            background-repeat: no-repeat;
            background-position: 50%;
            transition: background-color 0.3s;
        }
        .gutter:hover { background-color: #ced4da; }
        .gutter.gutter-horizontal {
            cursor: col-resize;
            width: 8px; /* 加寬 Gutter 方便拖曳 */
        }
        /*
         * 版面高度修復：
         * 1) 避免固定扣 76px 導致不同字體縮放下出現上下留白
         * 2) 覆蓋 paq.css 的 body padding-bottom 與 navbar mb-3 造成的空隙
         */
        html, body {
            height: 100dvh !important;
            min-height: 100dvh !important;
            margin: 0 !important;
            overflow: hidden !important;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }
        body {
            padding-bottom: 0 !important;
        }
        body > nav.navbar {
            margin-bottom: 0 !important;
            flex: 0 0 auto;
        }
        #main-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            height: auto;
            display: flex;
            overflow: hidden;
            min-width: 0;
        }
        
        /* 側邊欄過渡動畫 */
        #sidebar-pane {
            transition: width 0.3s ease, min-width 0.3s ease;
            overflow: hidden;
            background-color: #212529; /* 深色主題 */
            color: #fff;
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
            position: relative;
            z-index: 200;
        }
        #sidebar-pane.collapsed {
            width: 50px !important;
            min-width: 50px !important;
            max-width: 50px !important;
        }
        /* 收合時隱藏內容，僅顯示 Icon */
        #sidebar-pane.collapsed .sidebar-content { display: none; }
        #sidebar-pane.collapsed .sidebar-mini { display: flex; }
        
        /* 展開時隱藏 Mini Icon */
        #sidebar-pane:not(.collapsed) .sidebar-mini { display: none; }

        .sidebar-mini {
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 20px;
        }
        .sidebar-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-width: 250px; /* 防止內容擠壓 */
        }

        #split-wrapper {
            flex: 1 1 auto;
            min-width: 0;
            width: 0;
            overflow: hidden;
        }

        #matrix-pane,
        #aux-pane {
            min-width: 0;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/study.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">

</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.0/split.min.js" integrity="sha384-0blL3GqHy6+9fw0cyY2Aoiwg4onHAtslAs4OkqZY7UQBrR65/K4gI+hxLdWDrjpz" crossorigin="anonymous"></script>

<script src="{{ url_for('static', filename='js/study_core.js') }}?v=2.4"></script>
<script src="{{ url_for('static', filename='js/study_chat.js') }}?v=1.4"></script>
<script src="{{ url_for('static', filename='js/workflow_status.js') }}?v=0.2"></script>

<script>
    // 全局錯誤捕捉
    window.addEventListener('error', function(event) {
        console.error('[Global Error]', event.error);
    });

    // 延遲初始化
    window.addEventListener('load', function() {
        console.log('[App] Page fully loaded');
        initializeApp();
    });
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('[App] DOM Content Loaded');
        // 不在這裡初始化，等待 load 事件
    });
    
    function initializeApp() {
        console.log('[App Init] DOM 完全加載，開始初始化...');
        
        try {
            // 檢查必要的 DOM 元素
            const requiredElements = [
                'matrixContainer',
                'sidebar-pane',
                'matrix-pane',
                'aux-pane',
                'chat-context-badge',
                'dimensionFilterMenu',
                'matrix-title',
                'fulltext-content',
                'inline-fulltext-panel',
                'btn-view-matrix',
                'btn-view-fulltext',
                'matrix-mode-badge'
            ];
            let missingElements = [];
            
            requiredElements.forEach(id => {
                if (!document.getElementById(id)) {
                    missingElements.push(id);
                    console.warn(`[App Init] 缺少 DOM 元素: #${id}`);
                }
            });
            
            if (missingElements.length > 0) {
                throw new Error(`缺少必要的 DOM 元素: ${missingElements.join(', ')}`);
            }
            
            // 初始化各模組
            console.log('[App Init] 1/3 - 初始化 StudyView...');
            window.studyView = new StudyView();
            console.log('[App Init] ✓ StudyView 初始化完成');
            
            console.log('[App Init] 2/3 - 初始化 StudyCore...');
            window.studyCore = new StudyCore();
            console.log('[App Init] ✓ StudyCore 初始化完成');
            
            console.log('[App Init] 3/3 - 初始化 StudyChat...');
            window.studyChat = new StudyChat();
            console.log('[App Init] ✓ StudyChat 初始化完成');
            
            // 初始化 Split.js
            console.log('[App Init] 初始化 Split.js...');
            if (typeof Split !== 'undefined') {
                Split(['#matrix-pane', '#aux-pane'], {
                    sizes: [70, 30], 
                    minSize: [400, 300],
                    gutterSize: 8,
                    snapOffset: 0
                });
                console.log('[App Init] ✓ Split.js 初始化完成');
            } else {
                console.warn('[App Init] ⚠ Split.js 庫未載入');
            }
            
            // 隱藏加載指示器
            const loader = document.getElementById('app-loading-indicator');
            if (loader) {
                loader.style.display = 'none';
            }
            
            console.log('[App Init] 🎉 初始化成功完成！');
            
        } catch (error) {
            console.error('[App Init ERROR]', error.message);
            console.error('[App Init STACK]', error.stack);
            
            // 隱藏加載指示器並顯示錯誤
            const loader = document.getElementById('app-loading-indicator');
            if (loader) {
                loader.style.display = 'none';
            }
            
            // 顯示友好的錯誤訊息
            const errorHtml = `
            <div style="
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: #f8f9fa;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 20px;
                font-family: monospace;
                z-index: 9999;">
                
                <div style="
                    background: white;
                    border: 2px solid #dc3545;
                    border-radius: 8px;
                    padding: 30px;
                    max-width: 600px;
                    box-shadow: 0 0 20px rgba(0,0,0,0.1);">
                    
                    <h2 style="color: #dc3545; margin-top: 0;">❌ 初始化失敗</h2>
                    
                    <p style="color: #666; margin: 15px 0;">
                        <strong>錯誤訊息：</strong><br>
                        <code style="
                            background: #f5f5f5;
                            padding: 10px;
                            border-left: 3px solid #dc3545;
                            display: block;
                            margin: 10px 0;
                            overflow-x: auto;
                        ">${error.message}</code>
                    </p>
                    
                    <p style="color: #999; font-size: 12px; margin: 15px 0;">
                        <strong>詳細資訊：</strong><br>
                        <code style="
                            background: #f5f5f5;
                            padding: 10px;
                            border-left: 3px solid #999;
                            display: block;
                            margin: 10px 0;
                            overflow-x: auto;
                            max-height: 200px;
                            overflow-y: auto;
                        ">${error.stack}</code>
                    </p>
                    
                    <p style="color: #666;">
                        ✓ 請按 <kbd>F12</kbd> 打開開發者工具 > Console 標籤查看完整錯誤訊息<br>
                        ✓ 可用的全局物件：
                        <code style="background: #f5f5f5; padding: 2px 6px;">
                            window.studyView, window.studyCore, window.studyChat
                        </code>
                    </p>
                    
                    <button onclick="location.reload()" style="
                        background: #007bff;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 14px;
                        margin-top: 10px;">
                        🔄 重新加載
                    </button>
                </div>
            </div>
            `;
            
            document.body.innerHTML = errorHtml;
        }
    }
</script>

</body>
