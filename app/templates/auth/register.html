<!--
  檔案路徑: app/templates/auth/register.html
  產生時間: 2026-07-26 00:40 +08:00
  版本: v2.0
  模組定位:
    使用者註冊頁面，AUTH_MODE=session 下可自行建立帳號。
  主要責任: 宣告可存取的頁面結構、表單/狀態容器與靜態資源接線；不承擔授權判斷。
    1. 顯示 email / password / confirm_password 表單。
    2. 表單含 csrf_token()。
    3. 顯示後端驗證錯誤訊息。
  輸入輸出契約:
    POST /auth/register — email, password, confirm_password, csrf_token
  維護提醒:
    - 帳號識別為 email；顯示名由後端從 email 前綴自動產生，使用者不需輸入。
    - 前端 setCustomValidity 的提示字串必須與後端 EMAIL_FORMAT_ERROR 一致
      （「請使用mail格式註冊」），否則兩條路徑會給出不同說法。
    - 刻意不使用 type="email"：瀏覽器原生泡泡無法客製文案，改用 type="text"
      搭配 pattern + setCustomValidity 才能顯示產品指定字串。
    - 密碼最短 8 字元。
    - Bootstrap 5 風格與其他頁面一致。
  驗證方式:
    python -m pytest test/unit/test_email_auth.py -q
-->
{% include '_header.html' %}

<div class="container" style="max-width: 460px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="card-title fw-bold mb-4 text-center">
                <i class="bi bi-person-plus text-info me-2"></i>建立帳號
            </h4>

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="text" id="email" name="email" class="form-control"
                           autocomplete="email" required autofocus
                           maxlength="254"
                           placeholder="you@example.com"
                           pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}">
                    <div class="form-text">請使用 Email 作為登入帳號。</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">密碼</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="new-password" required minlength="8">
                    <div class="form-text">至少 8 個字元。</div>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-semibold">確認密碼</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                           autocomplete="new-password" required minlength="8">
                </div>

                <button type="submit" class="btn btn-success w-100 mt-1">
                    <i class="bi bi-person-check me-1"></i>註冊
                </button>
            </form>

            <hr class="my-3">
            <p class="text-center text-muted small mb-0">
                已有帳號？
                <a href="{{ url_for('auth.login') }}">返回登入</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
<script>
    // 讓瀏覽器端的格式提示與後端 EMAIL_FORMAT_ERROR 同字串。
    // pattern 不符時瀏覽器預設顯示英文泡泡，必須用 setCustomValidity 覆蓋。
    (function () {
        var emailInput = document.getElementById('email');
        if (!emailInput) return;
        var MSG = '請使用mail格式註冊';
        function sync() {
            emailInput.setCustomValidity(emailInput.validity.patternMismatch ? MSG : '');
        }
        emailInput.addEventListener('input', sync);
        emailInput.addEventListener('invalid', sync);
    })();
</script>
</body>
</html>
