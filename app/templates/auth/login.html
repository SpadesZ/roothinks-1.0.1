<!-- Roothinks source maintenance contract
  上下游: Flask route 注入 session/PID/initial data，模板載入 static CSS/JS，使用者操作再回到後端 API。
-->
<!--
  檔案路徑: app/templates/auth/login.html
  產生時間: 2026-07-26 00:40 +08:00
  版本: v2.0
  模組定位:
    使用者登入頁面，支援 AUTH_MODE=session。
  主要責任: 宣告可存取的頁面結構、表單/狀態容器與靜態資源接線；不承擔授權判斷。
    1. 顯示 email / password 表單。
    2. 表單含 csrf_token()，由 _auth_guard csrf.protect() 驗證。
    3. 傳遞 next 隱藏欄位，讓登入後導回原頁。
  輸入輸出契約:
    POST /auth/login — email, password, next, csrf_token
  維護提醒:
    - 登入識別為 email，不再接受 username。
    - 格式提示字串必須與後端 EMAIL_FORMAT_ERROR 一致（「請使用mail格式註冊」）。
    - 僅在 AUTH_MODE=session 時由 _auth_guard 重導至此。
    - Bootstrap 5 + Bootstrap Icons 與其他頁面一致。
  驗證方式:
    python -m pytest test/unit/test_email_auth.py -q
-->
{% include '_header.html' %}

<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="card-title fw-bold mb-4 text-center">
                <i class="bi bi-box-arrow-in-right text-info me-2"></i>登入 roothinks
            </h4>

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            {% with msgs = get_flashed_messages(with_categories=true) %}
              {% for cat, m in msgs %}
              <div class="alert alert-{{ 'warning' if cat == 'warning' else 'info' }} py-2">{{ m }}</div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}{% if next %}?next={{ next }}{% endif %}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="text" id="email" name="email" class="form-control"
                           autocomplete="email" required autofocus
                           maxlength="254"
                           placeholder="you@example.com"
                           pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">密碼</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-1">
                    <i class="bi bi-box-arrow-in-right me-1"></i>登入
                </button>
            </form>

            <hr class="my-3">
            <p class="text-center text-muted small mb-0">
                尚無帳號？
                <a href="{{ url_for('auth.register') }}">立即註冊</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
<script>
    // 與 register.html 同規：pattern 不符時顯示產品指定字串而非瀏覽器預設英文泡泡。
    (function () {
        var emailInput = document.getElementById('email');
        if (!emailInput) return;
        var MSG = '請使用mail格式註冊';
        function sync() {
            emailInput.setCustomValidity(emailInput.validity.patternMismatch ? MSG : '');
        }
        emailInput.addEventListener('input', sync);
        emailInput.addEventListener('invalid', sync);
    })();
</script>
</body>
</html>
