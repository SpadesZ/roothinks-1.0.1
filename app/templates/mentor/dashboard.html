<!--
  檔案路徑: app/templates/mentor/dashboard.html
  產生時間: 2026-07-26 04:20 +08:00
  版本: v1.0
  模組定位:
    Mentor 儀表板：mentee 清單、活動統計、手稿與筆記檢視、派工與評論。
  主要責任:
    1. 左側 mentee 清單（含上線次數、停留時間、未完成工作數）。
    2. 右側分頁：總覽 / 專案與手稿 / Study 筆記 / 交付工作 / 評論。
    3. 以 email 新增 mentee。
  輸入輸出契約:
    全部資料來自 /api/mentor/* JSON API，由 mentor.js 取得。
  安全邊界:
    - 非 mentor 身分開啟本頁會看到說明區塊而非資料；真正的把關在後端
      _require_mentor / _require_mentee，前端隱藏僅為體驗。
    - mentee 的內容一律唯讀呈現。
  維護提醒:
    - Study 筆記按專案歸戶而非按人，因為 study 檔案沒有作者欄位；
      頁面上已明白標示這件事，避免 mentor 誤判內容作者。
  驗證方式:
    python -m pytest test/unit/test_mentor_scope.py -q
-->
{% include '_header.html' %}

<div class="container-fluid px-4" style="margin-top: 8px;">

    {% if not current_user.is_mentor %}
    <div class="alert alert-warning">
        <i class="bi bi-info-circle me-1"></i>
        你的帳號不具備 <strong>mentor</strong> 身分，因此看不到指導對象的資料。
        請聯絡系統管理者把 <code>users.system_role</code> 設為 <code>mentor</code>。
    </div>
    {% else %}

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-mortarboard text-info me-2"></i>指導者儀表板
        </h4>
        <div class="input-group input-group-sm" style="width: 380px;">
            <span class="input-group-text">新增指導對象</span>
            <input type="text" class="form-control" id="menteeEmailInput" placeholder="mentee@example.com">
            <button class="btn btn-primary" onclick="mentorApp.addMentee()">加入</button>
        </div>
    </div>
    <div class="alert alert-danger py-2 small" id="mentorError" style="display:none;"></div>

    <div class="row g-3">
        <div class="col-lg-4 col-xl-3">
            <div class="card shadow-sm">
                <div class="card-header fw-bold small bg-white">
                    指導對象 <span class="badge bg-secondary" id="menteeCount">0</span>
                </div>
                <div class="list-group list-group-flush" id="menteeList"
                     style="max-height: 70vh; overflow-y: auto;">
                    <div class="text-muted small p-3">載入中…</div>
                </div>
            </div>
        </div>

        <div class="col-lg-8 col-xl-9">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <div class="fw-bold" id="menteeTitle">請從左側選擇一位指導對象</div>
                    <ul class="nav nav-tabs card-header-tabs mt-2" id="mentorTabs" style="display:none;">
                        <li class="nav-item"><a class="nav-link active" href="#" data-tab="overview">總覽</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-tab="projects">專案與手稿</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-tab="notes">Study 筆記</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-tab="tasks">交付工作</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-tab="comments">評論</a></li>
                    </ul>
                </div>
                <div class="card-body" id="mentorTabBody" style="min-height: 60vh;">
                    <div class="text-muted small">尚未選擇指導對象。</div>
                </div>
            </div>
        </div>
    </div>

    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
{% if current_user.is_mentor %}
<script src="{{ url_for('static', filename='js/mentor.js') }}?v=1.0"></script>
<script>
    const mentorApp = new MentorDashboard();
    mentorApp.init();
</script>
{% endif %}
</body>
</html>
