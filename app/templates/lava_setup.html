{% include '_header.html' %}
<div class="container mt-4">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="m-0 text-primary fw-bold">
                <i class="bi bi-router"></i> 1. 建立 LLM 通訊線路 (Connections)
            </h5>
            <button class="btn btn-primary btn-sm" onclick="createConnection()">
                <i class="bi bi-plus-lg"></i> 新增線路
            </button>
        </div>
        <div class="card-body bg-light">
            <div id="connection-list-container" class="d-flex flex-column gap-3">
                <div class="text-center text-muted py-3">
                    <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                    Loading connections...
                </div>
            </div>
        </div>
    </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="m-0 text-info fw-bold">
                    <i class="bi bi-cpu"></i> 2. 執行資源控制 (Runtime CPU Control)
                </h5>
                <div class="text-muted small mt-1">設定 CPU 核數上限與 Flow A workers，將套用到後續任務執行。</div>
            </div>
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6 col-lg-4">
                        <label for="cpuCoresSelect" class="form-label fw-bold mb-1">CPU 核數上限</label>
                        <select class="form-select" id="cpuCoresSelect">
                            <option value="auto">Auto</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label class="form-label d-none d-md-block">&nbsp;</label>
                        <button class="btn btn-info text-white fw-bold w-100" id="btnSaveCpuCores">
                            <i class="bi bi-save2 me-1"></i>套用設定
                        </button>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label for="flowaWorkersSelect" class="form-label fw-bold mb-1">Flow A Workers</label>
                        <select class="form-select" id="flowaWorkersSelect">
                            <option value="1">1 worker</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-lg-2">
                        <label class="form-label d-none d-md-block">&nbsp;</label>
                        <button class="btn btn-outline-info fw-bold w-100" id="btnSaveFlowaWorkers">
                            <i class="bi bi-sliders me-1"></i>套用
                        </button>
                    </div>
                    <div class="col-12">
                        <div class="small text-muted" id="cpuRuntimeInfo">讀取 CPU 設定中...</div>
                    </div>
                </div>
            </div>
        </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
                <h5 class="m-0 text-success fw-bold">
                    <i class="bi bi-link-45deg"></i> 3. 服務綁定 (Service Binding)
            </h5>
            <div class="text-muted small mt-1">將系統的標準任務 (Services) 分派給指定的「已鎖定」LLM 線路。</div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 35%">任務名稱 (Task ID)</th>
                            <th style="width: 30%">LLM Selection (僅顯示 Locked)</th>
                            <th style="width: 20%">操作</th>
                            <th style="width: 15%">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="binding-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<template id="conn-row-template">
    <div class="conn-row card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-2 py-2">
            <span class="badge bg-dark conn-id-badge">LLM-?</span>
            
            <select class="form-select form-select-sm conn-vendor" style="width: 130px;">
                <option value="openrouter">OpenRouter</option>
                <option value="google">Google</option>
                <option value="openai">OpenAI</option>
            </select>

            <div class="input-group input-group-sm flex-grow-1">
                <input type="password" class="form-control conn-key" placeholder="輸入 API Key...">
            </div>

            <button class="btn btn-secondary btn-sm conn-btn-fetch" title="取得模型列表">
                <i class="bi bi-cloud-download"></i> Fetch
            </button>

            <select class="form-select form-select-sm conn-model" style="width: 180px;" disabled>
                <option value="">-- Select Model --</option>
            </select>

            <span class="badge bg-secondary conn-status">Unchecked</span>

            <div class="btn-group btn-group-sm">
                <button class="btn btn-warning text-dark conn-btn-test" disabled title="測試連線">
                    <i class="bi bi-lightning-fill"></i> Test
                </button>
                <button class="btn btn-success conn-btn-lock" disabled title="確認並鎖定">
                    <i class="bi bi-link"></i> Connect
                </button>
            </div>

            <button class="btn btn-outline-danger btn-sm conn-btn-del ms-2" title="刪除線路">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>
</template>

<script src="/static/js/lava_setup.js"></script>
</body></html>
