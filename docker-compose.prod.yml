# Roothinks source maintenance contract
# 檔案路徑: docker-compose.prod.yml
# 模組定位: 容器建置與編排層；固定 app/test/Redis 的映像、掛載、健康檢查與啟動順序。
# 主要責任: 宣告服務、映像、環境鍵、volume 與啟動/驗證命令，保持各環境可重現。
# 上下游: 開發/測試/GCP 操作者 -> Docker build/Compose -> app 與 Redis；正式 data/.env 由 host volume 提供。
# 維護邊界: 不得把 .env/data/secrets 打進 image；正式 cutover 只重建 app、保留 Redis 身分、健康檢查與 rollback image。
# 驗證: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
# Roothinks production override
# Usage:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file env.prod up -d --build

services:
  roothinks-paq:
    # Production must run image-packaged code only (no source-code bind mount).
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - API_AUTH_ENABLED=1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SOCKETIO_MESSAGE_QUEUE=${SOCKETIO_MESSAGE_QUEUE}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI}
      - LOCK_ROOT=/tmp/roothinks-locks
      # Transitional SQLite-safe defaults; if PostgreSQL is enabled, adjust upward.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-4}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_CONNECT_TIMEOUT_SEC=${DB_CONNECT_TIMEOUT_SEC:-30}
      # Web process profile (transitional): gthread reduces single-worker starvation risk.
      # NLLB 模型為每個 worker 各載一份 (~2.4GB);保持 1 worker,除非 VM 有 ≥8GB RAM。
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_WORKER_CLASS=${GUNICORN_WORKER_CLASS:-gthread}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - GUNICORN_GRACEFUL_TIMEOUT=${GUNICORN_GRACEFUL_TIMEOUT:-60}
      - LITERATURE_MAX_WORKERS=${LITERATURE_MAX_WORKERS:-1}
      - LITERATURE_FLOWB_TIMEOUT_SEC=${LITERATURE_FLOWB_TIMEOUT_SEC:-7200}
      - LITERATURE_FLOWB_STALE_SEC=${LITERATURE_FLOWB_STALE_SEC:-7500}
      # NLLB 離線翻譯 (模型 bake 在映像 /opt/models/nllb,不放進 ./data 掛載)
      - NLLB_MODEL_DIR=${NLLB_MODEL_DIR:-/opt/models/nllb}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
