# Roothinks source maintenance contract
# 檔案路徑: docker-compose.test.yml
# 模組定位: 容器建置與編排層；固定 app/test/Redis 的映像、掛載、健康檢查與啟動順序。
# 主要責任: 宣告服務、映像、環境鍵、volume 與啟動/驗證命令，保持各環境可重現。
# 上下游: 開發/測試/GCP 操作者 -> Docker build/Compose -> app 與 Redis；正式 data/.env 由 host volume 提供。
# 維護邊界: 不得把 .env/data/secrets 打進 image；正式 cutover 只重建 app、保留 Redis 身分、健康檢查與 rollback image。
# 驗證: docker compose -f docker-compose.test.yml config
# Path: docker-compose.test.yml
# Purpose: isolated, one-shot test runner. It does not expose ports or mount product data.
# Usage: docker compose -p roothinks10005-tests -f docker-compose.test.yml build roothinks-test
#        docker compose -p roothinks10005-tests -f docker-compose.test.yml run --rm roothinks-test

name: roothinks10005-tests

services:
  roothinks-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        BASE_IMAGE: ${ROOTTHINKS_TEST_BASE_IMAGE:-roothinks10005-roothinks-paq:latest}
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - API_AUTH_ENABLED=0
      - SOCKETIO_ASYNC_MODE=threading
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./test:/app/test:ro
    command: ["python", "-m", "pytest", "test", "-q", "-p", "no:cacheprovider"]
