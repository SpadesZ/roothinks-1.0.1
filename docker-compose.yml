# 路徑(./docker-compose.yml) #版本 v0.4 #更版時間 20260409
# Base compose (shared by dev/prod). Keep this file free of source-code bind mount.

services:
  roothinks-paq:
    build: .
    container_name: roothinks_progress_paq_v8_10005
    ports:
      - "127.0.0.1:10005:10005"
    environment:
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      - SOCKETIO_MESSAGE_QUEUE=${SOCKETIO_MESSAGE_QUEUE:-redis://redis:6379/1}
      - LOCK_ROOT=${LOCK_ROOT:-/tmp/roothinks-locks}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-4}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_CONNECT_TIMEOUT_SEC=${DB_CONNECT_TIMEOUT_SEC:-30}
      - LITERATURE_MAX_WORKERS=${LITERATURE_MAX_WORKERS:-1}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_WORKER_CLASS=${GUNICORN_WORKER_CLASS:-eventlet}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - GUNICORN_GRACEFUL_TIMEOUT=${GUNICORN_GRACEFUL_TIMEOUT:-60}
    restart: on-failure:5
    depends_on:
      - redis
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: roothinks_progress_redis_10005
    restart: on-failure:5
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 256m
    cpus: 0.5
